name: Build and Release Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build extension
        run: bun run build

      - name: Create ZIP with hash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          cd dist
          zip -r ../extension-${SHORT_SHA}.zip .
          cd ..

      - name: Setup SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload extension ZIP
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp extension-${SHORT_SHA}.zip ${SERVER_USER}@${SERVER_HOST}:/var/www/linearntrack-api/public/downloads/
          ssh ${SERVER_USER}@${SERVER_HOST} "echo ${SHORT_SHA} > /var/www/linearntrack-api/public/downloads/latest.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ env.SHORT_SHA }}
          path: extension-${{ env.SHORT_SHA }}.zip
          retention-days: 30
